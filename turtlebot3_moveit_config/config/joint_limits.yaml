# Joint limits for MoveIt.
# Position limits are copied verbatim from
#   turtlebot3_manipulation_gazebo/ros2_control/turtlebot3_manipulation_system.ros2_control.xacro
# and from franka_description/robots/fr3/joint_limits.yaml.
# NOTE the two unusual limits: fr3_joint4 max is negative, fr3_joint6 min is positive.

joint_limits:
  fr3_joint1:
    has_velocity_limits: true
    max_velocity: 2.62
    has_acceleration_limits: true
    max_acceleration: 7.5
    has_position_limits: true
    min_position: -2.9007
    max_position: 2.9007

  fr3_joint2:
    has_velocity_limits: true
    max_velocity: 2.62
    has_acceleration_limits: true
    max_acceleration: 5.0
    has_position_limits: true
    min_position: -1.8361
    max_position: 1.8361

  fr3_joint3:
    has_velocity_limits: true
    max_velocity: 2.62
    has_acceleration_limits: true
    max_acceleration: 5.0
    has_position_limits: true
    min_position: -2.9007
    max_position: 2.9007

  fr3_joint4:
    has_velocity_limits: true
    max_velocity: 2.62
    has_acceleration_limits: true
    max_acceleration: 5.0
    has_position_limits: true
    min_position: -3.0770
    max_position: -0.1169

  fr3_joint5:
    has_velocity_limits: true
    max_velocity: 5.26
    has_acceleration_limits: true
    max_acceleration: 10.0
    has_position_limits: true
    min_position: -2.8763
    max_position: 2.8763

  fr3_joint6:
    has_velocity_limits: true
    max_velocity: 4.18
    has_acceleration_limits: true
    max_acceleration: 10.0
    has_position_limits: true
    min_position: 0.4398
    max_position: 4.6216

  fr3_joint7:
    has_velocity_limits: true
    max_velocity: 5.26
    has_acceleration_limits: true
    max_acceleration: 10.0
    has_position_limits: true
    min_position: -3.0508
    max_position: 3.0508

  # 两指现在都是 hand group 的普通关节（不再有 mimic），都要有限位。
  # 上下限都留 2mm 裕量（0.002/0.038，URDF 是 0/0.04）：Fortress 下 prismatic
  # 越过限位会永久卡死（上下限都实测踩中过），详见 ros2_control 的 xacro 注释。
  fr3_finger_joint1:
    has_velocity_limits: true
    max_velocity: 0.2
    has_acceleration_limits: false
    has_position_limits: true
    min_position: 0.002
    max_position: 0.038

  fr3_finger_joint2:
    has_velocity_limits: true
    max_velocity: 0.2
    has_acceleration_limits: false
    has_position_limits: true
    min_position: 0.002
    max_position: 0.038
