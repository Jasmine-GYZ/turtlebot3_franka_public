# MoveIt controller configuration.
#
# Uses MoveItSimpleControllerManager: the controllers are ALREADY spawned by
# turtlebot3_manipulation_gazebo/launch/turtlebot3_franka.launch.py, so MoveIt
# must NOT try to spawn them again (no ros2_control MoveIt manager).
#
#   arm_controller     -> JointTrajectoryController  (FollowJointTrajectory action)
#   gripper_controller -> JointTrajectoryController  (FollowJointTrajectory action)
#
# ★ 夹爪 2026-09-18 从 GripperActionController/GripperCommand 改成 JointTrajectoryController：
#   GripperCommand 是**单关节**接口，只能驱 fr3_finger_joint1，第二指只能指望 Gazebo 的
#   mimic——而 mimic 一接触就失效（一指停 0.030，另一指冻在 0.040 不动，gap 70mm 夹不住）。
#   换成 JTC 管两指后，MTC 的 MoveTo 直接下发两指轨迹，各指独立伺服、各自停在物体两侧。

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - gripper_controller

  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - fr3_joint1
      - fr3_joint2
      - fr3_joint3
      - fr3_joint4
      - fr3_joint5
      - fr3_joint6
      - fr3_joint7

  gripper_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - fr3_finger_joint1
      - fr3_finger_joint2
